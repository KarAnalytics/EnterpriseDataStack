version: 1
project:
  title: "The Enterprise Data Stack: A Practitioner's Handbook"
  authors:
    - name: Karthik Srinivasan
      url: https://business.ku.edu/people/karthik-srinivasan
      affiliation: University of Kansas School of Business
  copyright: '2026'
  github: KarAnalytics/EnterpriseDataStack
  exports:
    - format: typst
      template: plain_typst_book
      output: enterprise-data-stack.pdf
      justification: true
      show_pagenumber: true
      cover_affiliation: University of Kansas School of Business
      margin_left: 10
      margin_right: 10
      cover: cover_faded.png
      cover_width: 10
      coverposition: 2
  toc:
    - file: intro.md
    - file: chapters/how-to-use/intro.md
    - file: chapters/edm-foundations/intro.md
    - file: chapters/data-processing/intro.md
    - file: chapters/openrefine/intro.md
    - file: chapters/data-profiling/intro.md
    - file: chapters/data-governance/intro.md
    - file: chapters/regular-expressions/intro.md
    - file: chapters/er-model/intro.md
    - file: chapters/data-modeling/intro.md
    - file: chapters/relational-model/intro.md
    - file: chapters/normalization/intro.md
    - file: chapters/dw-concepts/intro.md
    - file: chapters/dw-design/intro.md
    - file: chapters/dw-design-advanced/intro.md
    - file: chapters/dw-examples/intro.md
    - file: chapters/sql-ddl-dcl-dml/intro.md
    - file: chapters/sql-queries/intro.md
    - file: chapters/sql-advanced/intro.md
    - file: chapters/etl-procedure/intro.md
    - file: chapters/etl-northwind/intro.md
    - file: chapters/graph-databases/intro.md
    - file: chapters/hadoop/intro.md
    - file: chapters/spark/intro.md
    - title: Appendix
      children:
        - file: chapters/appendix/oracle-cloud.md
        - file: chapters/appendix/sh-schema.md
        - file: chapters/appendix/glossary.md
        - file: chapters/appendix/project_ideas.md
site:
  title: The Enterprise Data Stack
  options:
    logo: cover.png
    favicon: cover.png
    folders: true
    BASE_URL: /EnterpriseDataStack
  template: book-theme
  actions:
    - title: Download PDF
      url: /EnterpriseDataStack/enterprise-data-stack.pdf
