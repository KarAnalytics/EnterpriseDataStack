name: Build and deploy MyST site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install mystmd
        run: npm install -g mystmd

      - name: Install Typst
        uses: typst-community/setup-typst@v3

      - name: Build HTML + PDF
        env:
          BASE_URL: /EnterpriseDataStack
        run: |
          myst build --html
          # The first PDF build downloads the plain_typst_book template into
          # _build/templates/typst/myst/plain_typst_book/. Overwrite it with the
          # customized copy in templates/ (cover page with the faded cover image,
          # navy theme, "Chapter N" headings, grey code blocks), then force a
          # rebuild so the customizations take effect.
          myst build --pdf || true
          TEMPLATE_DIR=_build/templates/typst/myst/plain_typst_book
          if [ -d "$TEMPLATE_DIR" ]; then
            echo "Patching $TEMPLATE_DIR with local customizations"
            cp templates/plain_typst_book/style.typ "$TEMPLATE_DIR/style.typ"
            cp templates/plain_typst_book/template.typ "$TEMPLATE_DIR/template.typ"
            cp templates/plain_typst_book/template.yml "$TEMPLATE_DIR/template.yml"
          else
            echo "ERROR: expected template dir $TEMPLATE_DIR not found"
            ls -R _build/templates || true
            exit 1
          fi
          rm -f enterprise-data-stack.pdf
          myst build --pdf --force
          # Serve the PDF at karanalytics.github.io/EnterpriseDataStack/enterprise-data-stack.pdf
          cp enterprise-data-stack.pdf _build/html/

      - name: Fix canonical site URL for SEO
        # MyST bakes the dev-server host into canonical links, og:url, the
        # sitemap and robots.txt. BASE_URL already adds the /EnterpriseDataStack
        # prefix, so only the scheme and host need replacing.
        run: |
          find _build/html -type f \( -name '*.html' -o -name '*.json' -o -name '*.xml' -o -name '*.txt' \) \
            -exec sed -i 's#http://localhost:3000#https://karanalytics.github.io#g' {} +

      - name: Inject GoatCounter analytics
        # Disabled until the "enterprisedatastack" site exists on goatcounter.com
        # (with "Allow adding visitor counts on your website" turned on).
        # To enable, delete the `if: false` line below.
        if: false
        # Done after `myst build` so MyST never sees these tags (it strips
        # <script> from page content). Both injections only touch <head>/<body>,
        # never MyST's content JSON, so React hydration stays valid.
        run: |
          # 1. Tracking: count every page view.
          GC_SCRIPT='<script data-goatcounter="https://enterprisedatastack.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>'
          find _build/html -name '*.html' -exec sed -i "s#</head>#${GC_SCRIPT}</head>#" {} +
          # 2. Visible counter: a small fixed footer line with the unique-visitor count.
          cp assets/gc-counter.js _build/html/gc-counter.js
          find _build/html -name '*.html' -exec sed -i 's|</body>|<script src="/EnterpriseDataStack/gc-counter.js"></script></body>|' {} +

      - uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
